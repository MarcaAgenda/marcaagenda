<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f8f7f4">
<meta name="description" content="Encontre nossos canais, serviços e informações em um só lugar.">
<title>Sua Marca • Conecte-se</title>
<style>
:root{--background:#f8f7f4;--ink:#232624;--muted:#858780;--line:#eae9e4;--gold:#b5976b}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -180px,#e9e2d5,transparent 65%),var(--background);color:var(--ink);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{width:min(100% - 36px,462px);margin:0 auto;padding:42px 0}
.top-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.24em;color:#aa9371;display:flex;justify-content:center;align-items:center;gap:11px}
.top-label:before,.top-label:after{content:"";width:21px;height:1px;background:#c6b79f}
header{text-align:center;padding:29px 16px 30px}
.monogram{height:78px;width:78px;margin:0 auto 21px;border-radius:24px;background:#252a27;color:#f6f2e9;box-shadow:0 12px 32px #11191626;display:grid;place-items:center;font:30px Georgia,serif}
.kicker{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:#9c886c;margin-bottom:8px}
h1{font:400 clamp(34px,9vw,44px)/1.05 Georgia,"Times New Roman",serif;letter-spacing:-.045em;margin:0 0 12px}
.description{max-width:315px;margin:0 auto;color:#777b74;font-size:14px;line-height:1.65}
.links{padding:12px;background:#fff;border:1px solid var(--line);border-radius:28px;box-shadow:0 16px 50px #2a292108}
.item{display:flex;align-items:center;gap:14px;min-height:75px;padding:12px 13px;border-radius:17px;color:inherit;text-decoration:none;transition:background .18s,transform .18s}
.item:not(:last-child){border-bottom:1px solid #f3f2ef}
a.item:hover{background:#f9f8f4;transform:translateY(-1px)}
a.item:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.item.inactive{opacity:.48;cursor:default}
.icon{width:46px;height:46px;flex:0 0 46px;border-radius:15px;display:grid;place-items:center;background:#f3f2ee;font-size:23px;font-weight:600}
.google{background:#edf3fe;color:#4285f4}.instagram{background:#faf0f5;color:#cf4b8c}.whatsapp{background:#edf7f0;color:#299765}.menu{background:#f7f3eb;color:#b48e54}.map{background:#eef3f7;color:#627f9e}.wifi{background:#f3f0f9;color:#8471a4}
.details{flex:1;min-width:0;display:flex;flex-direction:column}
.details strong{font-size:15px;line-height:1.35;font-weight:650;letter-spacing:-.015em}
.details small{color:#95978f;font-size:11.5px;margin-top:3px}
.arrow{font-size:18px;color:#b2b1a9}
footer{text-align:center;padding-top:27px;color:#999b95;font-size:11px}
footer:before{content:"";display:block;width:38px;height:1px;background:#d3bfa1;margin:0 auto 15px}
@media(max-width:365px){main{width:min(100% - 20px,462px);padding-top:25px}.links{padding:7px}.item{gap:10px;padding:10px 9px}.icon{width:41px;flex-basis:41px;height:41px}}
@media(prefers-reduced-motion:reduce){.item{transition:none}}
</style>
</head>
<body>
<main>
  <div class="top-label">Conexão inteligente</div>
  <header>
    <div class="monogram" id="monogram">SM</div>
    <div class="kicker" id="category">Boas-vindas</div>
    <h1 id="title">Sua Marca</h1>
    <p class="description" id="intro">Tudo o que você precisa, a um toque. Escolha como prefere se conectar com a gente.</p>
  </header>
  <nav class="links" id="links" aria-label="Links da empresa"></nav>
  <footer>Simples de acessar. Fácil de conectar.</footer>
</main>
<script>
/* EDITE AQUI: campos entre aspas; links vazios aparecem como "Em breve". */
const CONFIG = {
  nome: "Sua Marca",
  iniciais: "SM",
  categoria: "Boas-vindas",
  descricao: "Tudo o que você precisa, a um toque. Escolha como prefere se conectar com a gente.",
  links: {
    google: "",
    instagram: "",
    whatsapp: "",
    cardapio: "",
    localizacao: "",
    wifi: ""
  }
};
/* Exemplo de WhatsApp: https://wa.me/5555999999999 */
/* Para Google, use o link de solicitação de avaliações do Perfil da Empresa. */
/* Não coloque senhas de Wi-Fi nem dados sensíveis em páginas públicas. */
const itens = [
 {id:"google",nome:"Avalie no Google",sub:"Conte como foi sua experiência",ico:"G",cor:"google"},
 {id:"instagram",nome:"Siga no Instagram",sub:"Acompanhe novidades e conteúdos",ico:"◎",cor:"instagram"},
 {id:"whatsapp",nome:"Chamar no WhatsApp",sub:"Fale diretamente com a equipe",ico:"☎",cor:"whatsapp"},
 {id:"cardapio",nome:"Cardápio e serviços",sub:"Conheça o que oferecemos",ico:"▤",cor:"menu"},
 {id:"localizacao",nome:"Como chegar",sub:"Nossa localização no mapa",ico:"⌖",cor:"map"},
 {id:"wifi",nome:"Acesso ao Wi-Fi",sub:"Orientações para visitantes",ico:"⌁",cor:"wifi"}
];
document.getElementById("monogram").textContent=CONFIG.iniciais;
document.getElementById("category").textContent=CONFIG.categoria;
document.getElementById("title").textContent=CONFIG.nome;
document.getElementById("intro").textContent=CONFIG.descricao;
document.title=CONFIG.nome+" • Conecte-se";
const nav=document.getElementById("links");
function linkValido(raw){
  try { const url=new URL(String(raw||"").trim()); return ["https:","http:"].includes(url.protocol)?url.href:""; }
  catch { return ""; }
}
for(const item of itens){
  const url=linkValido(CONFIG.links[item.id]);
  const element=document.createElement(url?"a":"div");
  element.className="item"+(url?"":" inactive");
  if(url){element.href=url;element.target="_blank";element.rel="noopener noreferrer";element.setAttribute("aria-label",item.nome+": abrir link");}
  else{element.setAttribute("aria-disabled","true");}
  const icon=document.createElement("span");icon.className="icon "+item.cor;icon.textContent=item.ico;icon.setAttribute("aria-hidden","true");
  const text=document.createElement("span");text.className="details";
  const label=document.createElement("strong");label.textContent=item.nome;
  const hint=document.createElement("small");hint.textContent=url?item.sub:"Em breve • link ainda não configurado";
  text.append(label,hint);
  const arrow=document.createElement("span");arrow.className="arrow";arrow.textContent=url?"↗":"—";arrow.setAttribute("aria-hidden","true");
  element.append(icon,text,arrow);
  nav.append(element);
}
</script>
</body>
</html>
